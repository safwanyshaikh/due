# Render Blueprint for Due (production).
# One web service serves the Due app (/), the admin panel (/admin/) and the API (/api/),
# and runs the monitoring scheduler. One managed Postgres database.
databases:
  - name: due-db
    databaseName: due
    plan: basic-256mb
    postgresMajorVersion: '16'
    ipAllowList: []

services:
  - type: web
    name: due
    runtime: node
    plan: starter
    region: oregon
    buildCommand: >-
      npm ci --include=dev && npm run build &&
      npm --prefix admin ci --include=dev && npm --prefix admin run build &&
      npm --prefix server ci --include=dev && npm --prefix server run build
    startCommand: >-
      npm --prefix server run migrate &&
      npm --prefix server run seed:registry &&
      npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: RUN_SCHEDULER
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: due-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # You set this once in the Render dashboard, create the owner at /admin/setup, then delete it.
      - key: ADMIN_SETUP_TOKEN
        sync: false
      # Optional: set to enable important-alert emails (otherwise alerts stay in the admin panel).
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional: public origin used in e-mailed sign-in and invite links (e.g. https://due.example.com).
      # When unset, Render's RENDER_EXTERNAL_URL is used.
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional: Razorpay Subscriptions. Checkout stays unavailable (503) until all three are set
      # and plan ids are configured in the admin panel (Plans).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional: email forwarding intake. Forwarding is "not live" until both are set.
      - key: INBOUND_EMAIL_DOMAIN
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        sync: false
      # Optional: 32 random bytes, base64 (openssl rand -base64 32). Without it raw intake text is never stored.
      - key: DATA_ENCRYPTION_KEY
        sync: false
